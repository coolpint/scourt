name: scourt-weekly-health

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: scourt-weekly-health
  cancel-in-progress: false

jobs:
  weekly-health:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SCOURT_TIMEZONE: Asia/Seoul
      SCOURT_SCHEDULE_HOURS: "0,3,6,9,12,15,18,21"
      SCOURT_MONITORED_WORKFLOW: .github/workflows/scourt-news-bot.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run weekly health check
        run: |
          python -m scourt_bot.weekly_health --json

name: scourt-news-bot

on:
  workflow_dispatch:

concurrency:
  group: scourt-news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SCOURT_TIMEZONE: Asia/Seoul
      SCOURT_MAX_PAGES: "1"
      SCOURT_DB_PATH: data/scourt_news.db
      SCOURT_PDF_DIR: data/pdfs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore state cache
        id: state-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/scourt_news.db
          key: scourt-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scourt-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run dry-run smoke check
        run: |
          mkdir -p data/pdfs logs
          scourt-bot run --dry-run 2>&1 | tee logs/run.log

      - name: Save state cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/scourt_news.db
          key: scourt-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scourt-bot-logs-${{ github.run_id }}
          path: logs/run.log
          if-no-files-found: ignore
